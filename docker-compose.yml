# AEGIS — optional Docker Compose for local development
#
# AEGIS uses SQLite by default and needs no external services to run.
# This file is provided for teams that prefer to run the console in a
# container alongside any other services (e.g. a companion SIEM mock).
#
# Usage:
#   docker compose up --build
#
# The container serves the analyst console on http://localhost:8000.
# Mount your corpus feeds into /app/src/corpus/feeds/ to use real data.

version: "3.9"

services:
  aegis:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./aegis.db:/app/aegis.db
      - ./src/corpus/feeds:/app/src/corpus/feeds:ro
    environment:
      - DATABASE_PATH=/app/aegis.db
