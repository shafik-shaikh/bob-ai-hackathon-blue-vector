submission:
  title: "AEGIS — Alert Enrichment, Grouping & Intelligence Scoring"
  problem_statement: >
    Defence security operations analysts receive thousands of alerts daily from SIEM
    platforms, network sensors, geospatial feeds, and human-authored intelligence
    reports, each in a different format with an incompatible severity convention. No
    analyst can read them all, so triage defaults to vendor-assigned severity fields
    computed without knowledge of the asset involved or of surrounding activity.
    Genuine multi-stage intrusions appear as unremarkable individual alerts scattered
    across separate consoles, while false positives consume roughly half of all
    investigation time. Commanders need BLUF-format assessments in minutes, not log
    dumps.
  solution_summary: >
    AEGIS normalises alerts from four heterogeneous sources into a single schema, maps
    each to MITRE ATT&CK v19.2 techniques against the official STIX corpus, and
    correlates them into incidents by constructing a weighted alert graph. Four
    independent signals contribute edge weight: rarity-weighted shared indicators,
    temporal decay, asset adjacency, and directional kill-chain tactic progression;
    every edge stores the evidence that produced it. Incidents are scored on
    correlation confidence, asset criticality, kill-chain depth, and false-positive
    likelihood from documented suppression rules, then rendered as BLUF briefs with a
    mandatory gaps section. IBM Bob is the analyst's conversational interface through
    six read-only MCP tools that read the same state as the console, so every ranking
    and grouping can be interrogated - including why a vendor-critical alert was
    deprioritised. Measured on the shipped corpus of 521 alerts: all six planted
    intrusions rank in the top six of 456 incidents, both look-alike benign scenarios
    are suppressed below every intrusion, and no noise alert is pulled into a planted
    incident.
  key_features:
    - "Four-format ingestion (SIEM JSON, RFC 5424 syslog, geospatial CSV, free-text intel with defanged IOCs) into one canonical alert schema with raw payload provenance"
    - "MITRE ATT&CK v19.2 technique mapping blending TF-IDF similarity against the official Enterprise STIX corpus with a curated keyword rule table; calibrated confidence"
    - "Graph correlation with an evidence trail: rarity-weighted indicators, temporal decay, asset adjacency, directional kill-chain progression; incidents as connected components"
    - "Four-factor consequence-based prioritisation with a visible decomposition and nine documented suppression rules; vendor severity preserved but never scored"
    - "IBM Bob integration via six read-only MCP tools (get_priority_queue, explain_correlation, get_bluf, why_deprioritised, search_by_technique, get_incident) answering from live correlation state"
    - "BLUF commander briefs with mandatory intelligence gaps; deterministic generator with validated optional watsonx.ai Granite refinement"
    - "Evaluation harness against planted ground truth (coverage, purity, queue position, suppression success) with results committed in src/eval/results.json"
    - "Dark analyst console with force-directed correlation graph, evidence hover, kill-chain view, score decomposition and 'why is this ranked here?' - no build step, Python only"
