submission:
  title: "SIEM ML Predictor"
  problem_statement: >
    Analysts triaging network-flow exports have to trust a black-box verdict or spend hours
    manually correlating fields across thousands of events to decide what is actually worth
    reviewing. Most ML-based triage tools give a single score with no visibility into why the
    model flagged an event, which features drove it, or how reliable the model is on traffic
    that looks different from what it was trained on — so analysts either over-trust the score
    or ignore it entirely.
  solution_summary: >
    SIEM ML Predictor is a single-page app that takes a raw network-flow export (CSV, Parquet,
    JSON or NDJSON in the UNSW-NB15 / Argus / Zeek layout), scores every event with a
    pre-trained XGBoost model, and — instead of just returning a number — walks the analyst
    through exactly how that score was produced: which columns were matched, which features
    were built, how the score grew tree by tree, where the decision threshold sits, and which
    features pushed the top-ranked event's score up. With labelled data it also reports full
    detection metrics (precision, recall, F1, ROC-AUC, PR-AUC, confusion matrix) so the model's
    real-world reliability is visible rather than assumed.
  key_features:
    - "Upload CSV/Parquet/JSON/NDJSON flow exports up to 300 MB / 2M rows, with case-insensitive column matching and alias resolution"
    - "7-step animated walkthrough of a real scored event: data received, columns matched, features built, tree-by-tree score growth, threshold decision, top reasons, final result"
    - "Per-event explanations via XGBoost's exact tree contributions (SHAP-style, not approximated)"
    - "Full detection statistics (precision, recall, F1, ROC-AUC, PR-AUC, ROC/PR curves, confusion matrix, per-attack-type detection rate) with a live threshold slider when a label/attack_cat column is present"
    - "Unlabelled-mode triage view: score distribution, flagged-event breakdown by protocol/service/source/port/time, and ranked top suspicious events"
    - "CSV export of every prediction (original columns plus ml_score and ml_flag)"
